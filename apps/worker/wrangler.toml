# ============================================================
# Wrangler — Cloudflare Worker
# Agenda Regional São Paulo
# ============================================================

name = "piedade-agenda-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# Ambiente de Desenvolvimento Local
# ============================================================

[env.development]
name = "piedade-agenda-worker-dev"

[env.development.vars]
APP_ENV = "development"
APP_VERSION = "0.0.1-s04"

[[env.development.d1_databases]]
binding = "DB"
database_name = "piedade-agenda-db"
database_id = "local"
migrations_dir = "drizzle"
