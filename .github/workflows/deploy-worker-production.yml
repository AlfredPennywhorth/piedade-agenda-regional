name: Deploy Worker — Produção

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmo que o SHA em main foi homologado e autorizado para produção'
        required: true
        type: boolean
        default: false
      confirm_backup:
        description: 'Confirmo que o ponto de restauração/backup do D1 foi verificado antes das migrations'
        required: true
        type: boolean
        default: false

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate · Migrate D1 · Deploy Worker · Configure secrets
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Validate production gate
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          CONFIRM_BACKUP: ${{ inputs.confirm_backup }}
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
          MASTER_BOOTSTRAP_SECRET: ${{ secrets.MASTER_BOOTSTRAP_SECRET }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM_RELEASE" = "true"
          test "$CONFIRM_BACKUP" = "true"
          test -n "$D1_DATABASE_ID"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PIN_PEPPER"
          test -n "$MASTER_BOOTSTRAP_SECRET"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize D1 production configuration
        shell: bash
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          sed -i "s|__D1_DATABASE_ID__|$D1_DATABASE_ID|" apps/worker/wrangler.toml
          grep -q "$D1_DATABASE_ID" apps/worker/wrangler.toml

      - name: Preflight D1 — reject duplicate convocacoes per event
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          TABLE_RESULT="$(pnpm --filter @piedade/worker exec wrangler d1 execute piedade-agenda-db-prod --remote --env production --command "SELECT COUNT(*) AS total FROM sqlite_master WHERE type = 'table' AND name = 'convocacoes';" --json)"
          TABLE_EXISTS="$(D1_RESULT="$TABLE_RESULT" node <<'NODE'
          const payload = JSON.parse(process.env.D1_RESULT || '[]')
          const entries = Array.isArray(payload) ? payload : [payload]
          const rows = entries.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : [])
          process.stdout.write(Number(rows[0]?.total ?? 0) > 0 ? 'true' : 'false')
          NODE
          )"

          if [ "$TABLE_EXISTS" != "true" ]; then
            echo "Preflight D1: tabela convocacoes ainda não existe; banco será inicializado pelas migrations."
            exit 0
          fi

          RESULT="$(pnpm --filter @piedade/worker exec wrangler d1 execute piedade-agenda-db-prod --remote --env production --command "SELECT evento_id, COUNT(*) AS quantidade FROM convocacoes GROUP BY evento_id HAVING COUNT(*) > 1;" --json)"
          D1_RESULT="$RESULT" node <<'NODE'
          const payload = JSON.parse(process.env.D1_RESULT || '[]')
          const entries = Array.isArray(payload) ? payload : [payload]
          const rows = entries.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : [])

          if (rows.length > 0) {
            console.error('Bloqueio de release: existem convocacoes duplicadas por evento no D1 de Produção.')
            console.error(JSON.stringify(rows, null, 2))
            process.exit(1)
          }

          console.log('Preflight D1: nenhuma duplicidade de evento_id em convocacoes.')
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @piedade/worker exec wrangler d1 migrations apply piedade-agenda-db-prod --remote --env production

      - name: Deploy Worker production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @piedade/worker exec wrangler deploy --env production

      - name: Configure PIN_PEPPER
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
        run: printf '%s' "$PIN_PEPPER" | pnpm --filter @piedade/worker exec wrangler secret put PIN_PEPPER --env production

      - name: Configure MASTER_BOOTSTRAP_SECRET
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MASTER_BOOTSTRAP_SECRET: ${{ secrets.MASTER_BOOTSTRAP_SECRET }}
        run: printf '%s' "$MASTER_BOOTSTRAP_SECRET" | pnpm --filter @piedade/worker exec wrangler secret put MASTER_BOOTSTRAP_SECRET --env production
